name: Cleanup old reports

on:
  schedule:
    - cron: '0 19 * * *'      # 每天 UTC 19:00，也就是台灣時間凌晨 3:00
  workflow_dispatch:          # 允許手動執行（測試用）

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete reports older than 30 days
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y%m%d)
          deleted=0
          shopt -s nullglob
          for f in reports/*.html; do
            b=$(basename "$f")
            d=""
            if [[ "$b" =~ ^[^-]+-([0-9]{8})- ]]; then
              d="${BASH_REMATCH[1]}"          # 舊格式：代號-日期-時間-亂數.html
            elif [[ "$b" =~ ^([0-9]{8})_ ]]; then
              d="${BASH_REMATCH[1]}"          # 盤後掃描：日期_代號.html
            fi
            if [ -n "$d" ] && [ "$d" -lt "$cutoff" ]; then
              git rm -q "$f"
              deleted=$((deleted+1))
            fi
          done
          echo "deleted=$deleted"
          if [ "$deleted" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "cleanup: remove $deleted reports older than 30 days"
            git push
          fi
